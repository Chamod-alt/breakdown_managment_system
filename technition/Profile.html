<div>
  <h2 class="text-2xl font-bold text-white">Change Password</h2>
  <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mt-6">
    <label class="flex flex-col">
      <p class="text-text-secondary-dark text-base font-medium pb-2">Current Password</p>
      <div class="flex items-stretch rounded-lg border border-gray-700 focus-within:ring-2 focus-within:ring-primary">
        <input id="currentPassword" type="password" placeholder="••••••••"
          class="form-input flex-1 bg-transparent text-white p-3 border-0 focus:ring-0" />
      </div>
    </label>

    <label class="flex flex-col">
      <p class="text-text-secondary-dark text-base font-medium pb-2">New Password</p>
      <div class="flex items-stretch rounded-lg border border-gray-700 focus-within:ring-2 focus-within:ring-primary">
        <input id="newPassword" type="password" placeholder="••••••••"
          class="form-input flex-1 bg-transparent text-white p-3 border-0 focus:ring-0" />
      </div>
    </label>

    <label class="flex flex-col">
      <p class="text-text-secondary-dark text-base font-medium pb-2">Confirm New Password</p>
      <div class="flex items-stretch rounded-lg border border-gray-700 focus-within:ring-2 focus-within:ring-primary">
        <input id="confirmPassword" type="password" placeholder="••••••••"
          class="form-input flex-1 bg-transparent text-white p-3 border-0 focus:ring-0" />
      </div>
    </label>
  </div>

  <div class="mt-6 text-right">
    <button id="updatePasswordBtn"
      class="bg-gray-700 text-white font-medium py-2 px-6 rounded-lg hover:bg-gray-600 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-gray-400">
      Update Password
    </button>
  </div>

      </div>
    </main>

  <script type="module">
    // Import Firebase SDKs
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    import { getDatabase, ref, get, update } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";
    import {  reauthenticateWithCredential, EmailAuthProvider, updatePassword } 
  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

    // Firebase Config
    const firebaseConfig = {
      apiKey: "AIzaSyC6oz8ByvNsHZTVkWlO_s1OKysSRXI06Ho",
      authDomain: "breakdown-managment-system.firebaseapp.com",
      databaseURL: "https://breakdown-managment-system-default-rtdb.firebaseio.com",
      projectId: "breakdown-managment-system",
      storageBucket: "breakdown-managment-system.firebasestorage.app",
      messagingSenderId: "1021734538757",
      appId: "1:1021734538757:web:679094e39652c0912f566c",
      measurementId: "G-171E9J06HV"
    };

    // Initialize Firebase
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getDatabase(app);

    //
    

    // DOM Elements
    const NameInput = document.getElementById("Name");
    const RoleInput = document.getElementById("Role");
    const emailInput = document.getElementById("email");
    const phoneInput = document.getElementById("phone");
    const saveBtn = document.getElementById("saveBtn");

    // --- FETCH USER DATA ---
    onAuthStateChanged(auth, (user) => {
      if (user) {
        const usersRef = ref(db, "users");

        get(usersRef).then((snapshot) => {
          if (snapshot.exists()) {
            const users = snapshot.val();
            let foundUser = null;

            // Loop through users to find matching authUID
            for (let key in users) {
              if (users[key].authUID === user.uid) {
                foundUser = { key, ...users[key] };
                break;
              }
            }

            if (foundUser) {
              // Fill the form
              NameInput.value = foundUser.name || "";
              RoleInput.value = foundUser.role || "";
              emailInput.value = foundUser.email || "";
              phoneInput.value = foundUser.phone || "";

              // Attach save event for this user's node
              saveBtn.addEventListener("click", () => {
                const user = auth.currentUser;
                if (!user) return alert("Please log in first!");

                const usersRef = ref(db, "users");
                get(usersRef).then((snapshot) => {
                  if (snapshot.exists()) {
                    const users = snapshot.val();
                    let userKey = null;

                    for (let key in users) {
                      if (users[key].authUID === user.uid) {
                        userKey = key;
                        break;
                      }
                    }

                    if (userKey) {
                      const userRef = ref(db, "users/" + userKey);
                      update(userRef, {
                        name: NameInput.value,
                        role: RoleInput.value,
                        phone: phoneInput.value
                      })
                        .then(() => alert("Profile updated successfully!"))
                        .catch((err) => alert("Error updating profile: " + err.message));
                    } else {
                      alert("User not found in database.");
                    }
                  }
                });
              });


            } else {
              console.log("No matching user data found in DB");
            }

          } else {
            console.log("No users found in DB");
          }
        }).catch((error) => {
          console.error("Error fetching user data:", error);
        });

      } else {
        alert("Please log in first!");
        window.location.href = "login.html";
      }
    });

    // DOM Elements
const currentPasswordInput = document.getElementById("currentPassword");
const newPasswordInput = document.getElementById("newPassword");
const confirmPasswordInput = document.getElementById("confirmPassword");
const updatePasswordBtn = document.getElementById("updatePasswordBtn");

updatePasswordBtn.addEventListener("click", async () => {
  const user = auth.currentUser;
  const currentPassword = currentPasswordInput.value;
  const newPassword = newPasswordInput.value;
  const confirmPassword = confirmPasswordInput.value;

  if (!user) {
    alert("Please log in first!");
    return;
  }

  if (!currentPassword || !newPassword || !confirmPassword) {
    alert("Please fill in all fields!");
    return;
  }

  if (newPassword !== confirmPassword) {
    alert("New passwords do not match!");
    return;
  }

  try {
    // Re-authenticate the user
    const credential = EmailAuthProvider.credential(user.email, currentPassword);
    await reauthenticateWithCredential(user, credential);

    // Update the password
    await updatePassword(user, newPassword);
    alert("Password updated successfully!");

    // Clear input fields
    currentPasswordInput.value = "";
    newPasswordInput.value = "";
    confirmPasswordInput.value = "";
  } catch (error) {
    console.error("Error updating password:", error);
    alert("Error: " + error.message);
  }
});

  </script>
