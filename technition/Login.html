<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Login - System Breakdown Information System</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/>

<!-- Firebase SDKs -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<script>
    tailwind.config = {
        darkMode: "class",
        theme: {
            extend: {
                colors: {
                    "primary": "#1173d4",
                    "background-dark": "#101922",
                    "text-dark": "#f3f4f6",
                    "text-secondary-dark": "#9ca3af"
                },
                fontFamily: {
                    "display": ["Inter", "sans-serif"]
                },
                borderRadius: {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"
                }
            }
        }
    }

   
</script>

<style>
    .material-symbols-outlined {
        font-variation-settings:
            'FILL' 0,
            'wght' 400,
            'GRAD' 0,
            'opsz' 24;
    }
</style>
</head>
<body class="bg-background-dark font-display text-text-dark">

<div class="relative flex min-h-screen w-full flex-col items-center justify-center overflow-x-hidden">
    <div class="flex flex-col max-w-lg w-full">
        <!-- Header -->
        <div class="flex flex-col gap-3 p-4 items-center text-center">
            <div class="flex items-center gap-3">
                <span class="material-symbols-outlined text-primary text-5xl">emergency_home</span>
                <p class="text-text-dark text-4xl font-black leading-tight">System Breakdown Information System</p>
            </div>
            <p class="text-text-secondary-dark text-lg font-normal">Technician Login</p>
        </div>

        <!-- Form -->
        <div class="flex flex-col gap-4 p-4">
            <!-- Email -->
            <label class="flex flex-col w-full">
                <p class="text-text-dark text-base font-medium pb-2">Email</p>
                <input id="email" type="email" class="form-input flex w-full rounded-lg text-text-dark focus:outline-none focus:ring-2 focus:ring-primary border border-gray-700 bg-background-dark h-14 placeholder:text-text-secondary-dark p-3" placeholder="Enter your email"/>
            </label>

            <!-- Password -->
            <label class="flex flex-col w-full">
                <p class="text-text-dark text-base font-medium pb-2">Password</p>
                <div class="flex w-full items-stretch rounded-lg border border-gray-700 bg-background-dark">
                    <input id="password" type="password" class="flex-1 bg-transparent text-text-dark placeholder:text-text-secondary-dark p-3 rounded-l-lg focus:outline-none focus:ring-0" placeholder="Enter your password"/>
                    <div class="flex items-center justify-center pr-3 text-text-secondary-dark cursor-pointer">
                        <span class="material-symbols-outlined text-xl">visibility</span>
                    </div>
                </div>
            </label>

            <!-- Login Button -->
            <button id="loginBtn" class="flex w-full h-12 items-center justify-center bg-green-500 text-white text-base font-bold rounded-lg hover:bg-primary/90 focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2 dark:ring-offset-background-dark">
                Login
            </button>

            <!-- Message -->
            <p id="loginMessage" class="text-red-500 text-sm mt-2 text-center"></p>
        </div>

        <!-- Footer Links -->
        <div class="flex flex-col items-center gap-3 px-4 py-3">
            <a class="text-primary text-sm font-medium hover:underline" href="#">Forgot Password?</a>
            <p class="text-text-secondary-dark text-sm">
                Don't have an account? 
                <a class="font-bold text-primary hover:underline" href="#">Register</a>
            </p>
        </div>

        <div class="flex flex-col items-center mt-8">
            <p class="text-text-secondary-dark text-xs">© 2023 System Breakdown Information System. All rights reserved.</p>
            <a class="text-text-secondary-dark text-xs hover:underline" href="#">Support</a>
        </div>
    </div>
</div>

<script>
    
  // ✅ Firebase Configuration
  const firebaseConfig = {
    apiKey: "AIzaSyC6oz8ByvNsHZTVkWlO_s1OKysSRXI06Ho",
    authDomain: "breakdown-managment-system.firebaseapp.com",
    databaseURL: "https://breakdown-managment-system-default-rtdb.firebaseio.com",
    projectId: "breakdown-managment-system",
    storageBucket: "breakdown-managment-system.appspot.com",
    messagingSenderId: "1021734538757",
    appId: "1:1021734538757:web:679094e39652c0912f566c",
  };

  // ✅ Initialize Firebase
  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();

  // ✅ Login Button Logic
  const loginBtn = document.getElementById("loginBtn");
  const loginMessage = document.getElementById("loginMessage");

  loginBtn.addEventListener("click", () => {
    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;

    if (!email || !password) {
      loginMessage.textContent = "Please enter email and password.";
      return;
    }

    auth.signInWithEmailAndPassword(email, password)
      .then((userCredential) => {
        loginMessage.textContent = "";
        alert("Login successful!");
        // Delay redirect slightly to ensure auth state updates
        setTimeout(() => {
          window.location.href = "dashboard.html";
        }, 500);
      })
      .catch((error) => {
        loginMessage.textContent = error.message;
        console.error(error);
      });
  });
</script>

</body>
</html>
